name: Publish to NuGet

# Publishes the library itself, which is how anyone building against WolfCurses takes it.
# The example apps are shipped separately by release.yml; the two share a version *scheme*
# but not a number, since each is computed when its own workflow runs.
#
# Versions are date-based on purpose and must stay that way: old published versions
# (2018.9.12.1) outrank semver 10.x in NuGet's ordering, so anything below 2018.x would
# never show up as the latest release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave blank for the current YYYY.M.D.H)"
        required: false
        type: string

env:
  # The clock the version is read off. UTC keeps runs reproducible regardless of who
  # dispatches them; set it to e.g. America/Chicago to number releases in local time.
  RELEASE_TZ: UTC

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(TZ="$RELEASE_TZ" date +'%Y.%-m.%-d.%-H')"
          fi
          # The old scheme ended in github.run_number, which was unique by construction;
          # an hour is not, so two runs in the same hour now want the same version. A
          # published NuGet version can never be re-pushed, so ask nuget.org up front
          # rather than discovering it from a 409 after the tests and pack have run.
          # Best-effort by design: the flat-container index is CDN-cached and can lag a
          # push by a few minutes, and an unreadable index falls through to the push,
          # which rejects a duplicate anyway. It buys a clear message, not a guarantee.
          INDEX="$(curl -sSL --max-time 30 "https://api.nuget.org/v3-flatcontainer/wolfcurses/index.json" || true)"
          if VERSION="$VERSION" INDEX="$INDEX" python3 -c '
          import json, os, sys
          try:
              versions = json.loads(os.environ["INDEX"])["versions"]
          except Exception:
              print("::warning::Could not read the nuget.org version index; skipping the duplicate check.")
              sys.exit(1)
          sys.exit(0 if os.environ["VERSION"] in versions else 1)
          '; then
            echo "::error::WolfCurses $VERSION is already on nuget.org. Wait for the next hour or pass a version override."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Test
        run: dotnet test WolfCurses.sln -c Release

      - name: Pack
        run: >
          dotnet pack src/WolfCurses.csproj -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The glob matches only the .nupkg, but the .snupkg beside it goes up too: pushing a
      # package also pushes a same-named symbols package from the same folder unless
      # --no-symbols is passed. Pack produces both (IncludeSymbols + SymbolPackageFormat=snupkg
      # in src/WolfCurses.csproj), so the library ships with its debug symbols and nothing else -
      # the .nupkg holds lib/net10.0/WolfCurses.dll and the readme, the .snupkg the matching PDB.
      # The tests and both example apps are IsPackable=false and are never packed at all.
      - name: Push
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
